services:
  - type: web
    name: ah-sports-os
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production