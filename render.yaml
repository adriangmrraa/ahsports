services:
  - type: web
    name: ah-sports-os
    runtime: node
    plan: starter
    buildCommand: NODE_ENV=development npm install && npm run db:migrate && NODE_ENV=production npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production